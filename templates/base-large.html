<!DOCTYPE html>
<html lang="en">
<head>
  <title>Document</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- End Google Tag Manager -->

  <!-- Styles -->
  <link rel="stylesheet" href="/css/custom.css">
  <link rel="stylesheet" href="/css/nhsuk-frontend.min.css">
  <link rel="stylesheet" href="/css/style.css">

  <!-- Favicons -->
  <link rel="icon" href="/assets/images/favicon.ico" sizes="48x48">
  <link rel="icon" href="/assets/images/favicon.svg" sizes="any" type="image/svg+xml">
  <link rel="mask-icon" href="/assets/images/nhsuk-icon-mask.svg" color="#005eb8">
  <link rel="apple-touch-icon" href="/assets/images/nhsuk-icon-180.png">
  <link rel="manifest" href="/assets/manifest.json">
  <meta name="msapplication-TileColor" content="#005eb8">

  <script src="/js/tabs.js"></script>
  <script src="/js/copyDateToClipboard.js"></script>
  <script src="/js/copyToClipboard.js"></script>
  <script src="/js/pasteDateToDateInputs.js"></script>
</head>


<a class="nhsuk-skip-link" href="#main-content" data-module="nhsuk-skip-link">Skip to main content</a>
<header class="nhsuk-header" id="nhs-global-header" data-module="nhsuk-header" role="banner">
  <div class="nhsuk-header__container nhsuk-width-container">
    <div class="nhsuk-header__service">

      <svg class="nhsuk-header__logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 80" height="40" width="100" focusable="false" role="img" aria-label="NHS">
        <title>NHS</title>
        <path fill="currentcolor" d="M200 0v80H0V0h200Zm-27.5 5.5c-14.5 0-29 5-29 22 0 10.2 7.7 13.5 14.7 16.3l.7.3c5.4 2 10.1 3.9 10.1 8.4 0 6.5-8.5 7.5-14 7.5s-12.5-1.5-16-3.5L135 70c5.5 2 13.5 3.5 20 3.5 15.5 0 32-4.5 32-22.5 0-19.5-25.5-16.5-25.5-25.5 0-5.5 5.5-6.5 12.5-6.5a35 35 0 0 1 14.5 3l4-13.5c-4.5-2-12-3-20-3Zm-131 2h-22l-14 65H22l9-45h.5l13.5 45h21.5l14-65H64l-9 45h-.5l-13-45Zm63 0h-18l-13 65h17l6-28H117l-5.5 28H129l13.5-65H125L119.5 32h-20l5-24.5Z"/>
      </svg>

    </div>

  </div>

</header>

<div class="nhsuk-width-container" style="max-width: 1400px">
  <main id="main-content" role="main" class="nhsuk-main-wrapper">
  {% block content %}{% endblock %}
  </main>
</div>

<footer class="nhsuk-footer" role="contentinfo">
  <div class="nhsuk-width-container">
    <div class="nhsuk-footer__meta">
      <h2 class="nhsuk-u-visually-hidden">Support links</h2>
      <ul class="nhsuk-footer__list">
        <li class="nhsuk-footer__list-item">
          <a class="nhsuk-footer__list-item-link" href="#">Accessibility statement</a>
        </li>
        <li class="nhsuk-footer__list-item">
          <a class="nhsuk-footer__list-item-link" href="#">Contact us</a>
        </li>
        <li class="nhsuk-footer__list-item">
          <a class="nhsuk-footer__list-item-link" href="#">Cookies</a>
        </li>
        <li class="nhsuk-footer__list-item">
          <a class="nhsuk-footer__list-item-link" href="#">Privacy policy</a>
        </li>
        <li class="nhsuk-footer__list-item">
          <a class="nhsuk-footer__list-item-link" href="#">Terms and conditions</a>
        </li>
      </ul>
      <p class="nhsuk-body-s">© NHS England</p>
    </div>
  </div>
</footer>

<script src="/js/application.js"></script>
  <script src="/js/gov.js"></script>
  <script>
    window.GOVUKFrontend.initAll();
  </script>
<footer role="contentinfo">
<div class="nhsuk-footer" id="nhsuk-footer">
  <div class="nhsuk-width-container">
    <h2 class="nhsuk-u-visually-hidden">Support links</h2>
    <table class="nhsuk-footer__table">
      <tr>
        <td><a class="nhsuk-footer__list-item-link"
               href="https://www.nhs.uk/Pages/nhs-sites.aspx">NHS sites</a></td>
        <td><a class="nhsuk-footer__list-item-link"
               href="https://www.nhs.uk/about-us">About us</a></td>
        <td><a class="nhsuk-footer__list-item-link"
               href="https://www.nhs.uk/contact-us/">Contact us</a></td>
      </tr>
      <tr>
        <td><a class="nhsuk-footer__list-item-link"
               href="https://www.nhs.uk/about-us/sitemap/">Sitemap</a></td>
        <td><a class="nhsuk-footer__list-item-link"
               href="https://www.nhs.uk/our-policies/">Our policies</a></td>
        <td><a class="nhsuk-footer__list-item-link"
               href="https://www.nhsbsa.nhs.uk/accessibility-statement-dictionary-medicines-and-devices-browser-dmd-browser">Accessibility</a></td>
      </tr>
    </table>
  </div>
</div>

</body>
</html>

{% extends "base.html" %}
{% block content %}
<a class="nhsuk-back-link nhsuk-u-margin-bottom-6" href="home-page"><span id="back-link-text">Go back to home page </span></a>

<fieldset class="nhsuk-fieldset" aria-describedby="accreditation-body-hint">
    <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--xl">
        <h1 class="nhsuk-fieldset__heading nhsuk-u-margin-bottom-4">
            <span class="nhsuk-caption-l">
                Audit trail
              <span class="nhsuk-u-visually-hidden"> - </span>
            </span>
            Choose search route
        </h1>
    </legend>

    <div class="nhsuk-radios nhsuk-radios--conditional" data-module="nhsuk-radios">
        <div class="nhsuk-radios__item nhsuk-u-margin-bottom-5">
            <input class="nhsuk-radios__input" id="username" name="example" type="radio" value="choose-users">
            <label class="nhsuk-label nhsuk-radios__label" for="username">
                Choose user name
            </label>
        </div>


        <div class="nhsuk-radios__item">
            <input class="nhsuk-radios__input" id="attribute" name="example" type="radio" value="No">
            <label class="nhsuk-label nhsuk-radios__label" for="attribute">
                Choose attribute
            </label>
        </div>
    </div>
</fieldset>

<a class="nhsuk-button nhsuk-u-margin-top-5" id="continue-button" name="button" href="#">Save and continue</a>

</div>

<script type="text/javascript">
                var radioButtons = document.getElementsByName("example");
                let buttonLink = document.getElementById("continue-button");

                function updateButtonLink() {
                    for (var radio of radioButtons) {
                        if (radio.checked && radio.value === 'choose-users') {
                            buttonLink.href = "choose-users";
                            return; // exit loop early if 'No' is found
                        }
                    }
                    // If 'No' is not selected or no radio button is checked, default link
                    buttonLink.href = "choose-attribute";
                }

                // Call the function when the page loads to set the initial state
                updateButtonLink();

                // Add event listeners to each radio button to respond to changes
                radioButtons.forEach(function(radio) {
                    radio.addEventListener('change', updateButtonLink);
                });
            </script>


{% endblock %}

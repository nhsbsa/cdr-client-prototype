{% extends "base.html" %}
{% block content %}
<a class="nhsuk-back-link nhsuk-u-margin-bottom-6" href="save-query-add-cipher.html"><span id="back-link-text">Go back to save query add cipher  </span></a>


<fieldset class="nhsuk-fieldset">
  <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--xl">
    <h1 class="nhsuk-fieldset__heading nhsuk-u-margin-bottom-4">
            <span class="nhsuk-caption-l">
                Saved user defined query
              <span class="nhsuk-u-visually-hidden"> - </span>
            </span>
      Add user name
    </h1>
  </legend>
</fieldset>

<div class="nhsuk-form-group">
  <label class="nhsuk-label" for="select-1">
    Choose a username (Cypher) to add to the query
  </label>
  <select class="nhsuk-select" id="select-1" name="select-1">
    <option value="1"></option>
    <option value="2" >Cremb</option>
    <option value="3" >Anoth</option>
    <option value="3" >Sumon</option>
  </select>
</div>

<a class="nhsuk-button nhsuk-u-margin-top-5" data-module="nhsuk-button" type="submit" href="saved-udq-date.html" id="submitButton">
  Continue
</a>

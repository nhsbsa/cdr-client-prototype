{% extends "base.html" %}
{% block content %}
<a class="nhsuk-back-link nhsuk-u-margin-bottom-6" href="edit-search-criteria-query.html"><span id="back-link-text">Go back to edit search criteria query  </span></a>
<div>
  <fieldset class="nhsuk-fieldset">
    <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--xl">
      <h1 class="nhsuk-fieldset__heading nhsuk-u-margin-bottom-4">
            <span class="nhsuk-caption-l">
                User defined query
              <span class="nhsuk-u-visually-hidden"> - </span>
            </span>
        Edit search criteria conditional qualifier (Operators)
      </h1>
    </legend>
    <div class="nhsuk-grid-row">

    </div>
    <div class="nhsuk-form-group">
      <label class="nhsuk-label" for="select-name">
        Conditional qualifier (Operators)
      </label>
      <select class="nhsuk-select" id="select-name" name="select-1">
        <option value=""></option>
        <option value="Equal to">Equal to </option>
        <option value="Not equal to">Not equal to</option>
        <option value="Greater than">Greater than</option>
        <option value="Less than">Less than</option>
        <option value="Greater than or equal to">Greater than or equal to</option>
        <option value="Less than or equal to">Less than or equal to</option>

        <option value="Not exists">Not exists</option>
      </select>
    </div>
  </fieldset>

  <a class="nhsuk-button nhsuk-u-margin-top-5" data-module="nhsuk-button" type="submit" href="edit-search-criteria-query.html">
    Continue
  </a>

<!--  <button class="nhsuk-button nhsuk-button&#45;&#45;secondary nhsuk-u-margin-top-5" data-module="nhsuk-button" type="submit" href="#">-->
<!--    View results-->
<!--  </button>-->
</div>

{% endblock %}

{% extends "base.html" %}
{% block content %}
<a class="nhsuk-back-link nhsuk-u-margin-bottom-6" href="new-query-summary-page.html"><span id="back-link-text">Go back to summary page</span></a>


<fieldset class="nhsuk-fieldset">
  <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--xl">
    <h1 class="nhsuk-fieldset__heading nhsuk-u-margin-bottom-4">
            <span class="nhsuk-caption-l">
                User defined query
              <span class="nhsuk-u-visually-hidden"> - </span>
            </span>
      Edit internal and external attributes
    </h1>
  </legend>

  <div class="nhsuk-form-group">


    <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--l">
      <h2 class="nhsuk-fieldset__heading">
       Choose the required attribute
      </h2>
    </legend>

    <div class="nhsuk-radios" data-module="nhsuk-radios">

      <div class="nhsuk-radios__item">
        <input class="nhsuk-radios__input" id="example-1" name="example" type="radio" value="Show-between.html">
        <label class="nhsuk-label nhsuk-radios__label" for="example-1">
          Show Internal attribute only
        </label>
      </div>

      <div class="nhsuk-radios__item">
        <input class="nhsuk-radios__input" id="example-2" name="example" type="radio" value="show-starts-between.html">
        <label class="nhsuk-label nhsuk-radios__label" for="example-2">
          Show external attribute only
        </label>
      </div>

      <div class="nhsuk-radios__item">
        <input class="nhsuk-radios__input" id="example-2" name="example" type="radio" value="show-starts-between.html">
        <label class="nhsuk-label nhsuk-radios__label" for="example-2">
          Show both internal and external attributes
        </label>
      </div>

    </div>
  </div>
</fieldset>

<a class="nhsuk-button nhsuk-u-margin-top-5" data-module="nhsuk-button" type="submit" href="new-query-summary-page.html" onclick="navigate()">
  Continue
</a>




{% endblock %}

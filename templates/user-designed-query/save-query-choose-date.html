{% extends "base.html" %}
{% block content %}
<a class="nhsuk-back-link nhsuk-u-margin-bottom-6" href="save-query-cipher.html"><span id="back-link-text">Go back to Save query cipher </span></a>
<div>
  <fieldset class="nhsuk-fieldset">
    <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--xl">
      <h1 class="nhsuk-fieldset__heading nhsuk-u-margin-bottom-4">
            <span class="nhsuk-caption-l">
                Save user defined query
              <span class="nhsuk-u-visually-hidden"> - </span>
            </span>
       Choose save query date
      </h1>
    </legend>
    <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--l">
      <h1 class="nhsuk-fieldset__heading">
        Do you want to add a date to save query?
      </h1>
    </legend>

    <div class="nhsuk-radios" data-module="nhsuk-radios">

      <div class="nhsuk-radios__item">
        <input class="nhsuk-radios__input" id="example-1" name="example" type="radio" value="yes">
        <label class="nhsuk-label nhsuk-radios__label" for="example-1">
          Yes i want to add a date to save query
        </label>
      </div>

      <div class="nhsuk-radios__item">
        <input class="nhsuk-radios__input" id="example-2" name="example" type="radio" value="no">
        <label class="nhsuk-label nhsuk-radios__label" for="example-2">
          No i dont want to add a date to save query
        </label>
      </div>

    </div>
  </fieldset>

  <a class="nhsuk-button nhsuk-u-margin-top-5" data-module="nhsuk-button" type="submit" href="#" id="submitButton">
    Save and continue
  </a>

</div>
<script>
  document.getElementById("submitButton").addEventListener("click", function () {
    const selected = document.querySelector('input[name="example"]:checked');
    if (selected) {
      if (selected.value === "yes") {
        window.location.href = "save-query-add-date.html";
      } else if (selected.value === "no") {
        window.location.href = "save-query-choose-notes.html";
      }
    } else {
      alert("Please select an option.");
    }
  });
</script>
{% endblock %}

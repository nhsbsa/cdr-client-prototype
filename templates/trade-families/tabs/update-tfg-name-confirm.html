{% extends "trade-families/base.html" %}
{% block content %}
<div class="nhsuk-back-link">
    <a class="nhsuk-back-link__link" href="update-tfg-name">
        <svg class="nhsuk-icon nhsuk-icon__chevron-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            aria-hidden="true" height="24" width="24">
            <path
                d="M8.5 12c0-.3.1-.5.3-.7l5-5c.4-.4 1-.4 1.4 0s.4 1 0 1.4L10.9 12l4.3 4.3c.4.4.4 1 0 1.4s-1 .4-1.4 0l-5-5c-.2-.2-.3-.4-.3-.7z">
            </path>
        </svg>
        Go back</a>
</div>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <br />
        <h1 class="nhsuk-heading-xl">Name change summary</h1>
    </div>
</div>

<dl class="nhsuk-summary-list">
    <div class="nhsuk-summary-list__row">
        <dt class="nhsuk-summary-list__key">
            Current name
        </dt>
        <dd class="nhsuk-summary-list__value">
            Primary Wound
        </dd>
    </div>

    <div class="nhsuk-summary-list__row">
        <dt class="nhsuk-summary-list__key">
            New name
        </dt>
        <dd class="nhsuk-summary-list__value">
            Secondary Wound
        </dd>
    </div>

    <div class="nhsuk-summary-list__row">
        <dt class="nhsuk-summary-list__key">
            Start date
        </dt>
        <dd class="nhsuk-summary-list__value">
            01 February 2025
        </dd>
    </div>

    <div class="nhsuk-summary-list__row">
        <dt class="nhsuk-summary-list__key">
            End date
        </dt>
        <dd class="nhsuk-summary-list__value">
            01 February 3456
        </dd>
    </div>
</dl>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <a href="view-tfg#more" class="nhsuk-button" id="edit-tf">Continue</a>

        <a href="view-tfg#more" class="nhsuk-button nhsuk-u-margin-left-3" style="background-color: red;">Cancel</a>
    </div>
</div>

{% endblock %}

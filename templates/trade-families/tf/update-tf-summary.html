{% extends "base-large.html" %}
{% block breadcrumb %}
<nav class="nhsuk-breadcrumb" aria-label="Breadcrumb">
    <div class="nhsuk-width-container">
        <ol class="nhsuk-breadcrumb__list">
            <li class="nhsuk-breadcrumb__item"><a class="nhsuk-breadcrumb__link" href="tfg-table-view">Trade
                    family
                    groups</a></li>
        </ol>
    </div>
</nav>
{% endblock %}

{% block content %}
<div class="nhsuk-grid-row">
    <div id="content-pane" class="side-tree-view">
        <div class="nhsuk-grid-row">
            <div class="nhsuk-grid-column-full">
                <div class="nhsuk-back-link">
                    <a class="nhsuk-back-link__link" href="update-tf">
                        <svg class="nhsuk-icon nhsuk-icon__chevron-left" xmlns="http://www.w3.org/2000/svg"
                            viewBox="0 0 24 24" aria-hidden="true" height="24" width="24">
                            <path
                                d="M8.5 12c0-.3.1-.5.3-.7l5-5c.4-.4 1-.4 1.4 0s.4 1 0 1.4L10.9 12l4.3 4.3c.4.4.4 1 0 1.4s-1 .4-1.4 0l-5-5c-.2-.2-.3-.4-.3-.7z">
                            </path>
                        </svg>
                        Go back</a>
                </div>

                <span class="nhsuk-caption-l">Update summary</span>
                <h1 class="nhsuk-heading-xl">Anadin Extra</h1>
            </div>
        </div>

        <div class="nhsuk-grid-row nhsuk-grid-column-full">
            <table class="nhsuk-table nhsuk-u-padding-bottom-4" id="update-summary-table" role="table"
                style="display:table">
                <caption class="nhsuk-table__caption" id="update-summary-table-heading">Summary
                </caption>
                <thead class="nhsuk-table__head" role="rowgroup">
                    <tr role="row" id="update-summary-table-header-row">
                        <th class="" id="update-summary-table-header-field" role="columnheader" scope="col">
                            Field
                        </th>
                        <th class="" id="update-summary-table-header-previous-value" role="columnheader" scope="col">
                            Previous Value
                        </th>
                        <th class="" id="update-summary-table-header-new-value" role="columnheader" scope="col">
                            New Value
                        </th>
                    </tr>
                </thead>
                <tbody class="nhsuk-table__body">
                    <tr class="nhsuk-table__row" id="update-summary-table-extractable-row" role="row">
                        <td class="nhsuk-table__cell" id="update-summary-table-extractable-cell" role="cell">
                            <span id="update-summary-extractable--field">Extractable</span>
                        </td>
                        <td class="nhsuk-table__cell" id="update-summary-table-extractable-previous-cell" role="cell">

                            <span id="update-summary-extractable--previous">
                                <div>
                                    <svg class="nhsuk-icon nhsuk-icon__tick" xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 24 24" aria-hidden="true" fill="none">
                                        <path stroke-width="4" stroke-linecap="round" stroke="#007f3b"
                                            d="M18.4 7.8l-8.5 8.4L5.6 12"></path>
                                    </svg>
                                </div>
                            </span>
                        </td>
                        <td class="nhsuk-table__cell" id="update-summary-table-extractable-new-cell" role="cell">
                            <span id="update-summary-extractable--new">
                                <div>
                                    <svg class="nhsuk-icon nhsuk-icon--cross" xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 24 24" width="16" height="16" focusable="false" aria-hidden="true">
                                        <path fill="#d5281b"
                                            d="M17 18.5c-.4 0-.8-.1-1.1-.4l-10-10c-.6-.6-.6-1.6 0-2.1.6-.6 1.5-.6 2.1 0l10 10c.6.6.6 1.5 0 2.1-.3.3-.6.4-1 .4z M7 18.5c-.4 0-.8-.1-1.1-.4-.6-.6-.6-1.5 0-2.1l10-10c.6-.6 1.5-.6 2.1 0 .6.6.6 1.5 0 2.1l-10 10c-.3.3-.6.4-1 .4z" />
                                    </svg>
                                </div>
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a class="nhsuk-button" href="view-tf?updatedSummary#summary">Save and finish</a>
        <a class="nhsuk-button nhsuk-button--secondary" href="view-tf">Cancel update</a>
    </div>
</div>

{% endblock %}

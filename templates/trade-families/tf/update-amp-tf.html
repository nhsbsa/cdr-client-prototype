{% extends "base-large.html" %}
{% block breadcrumb %}
<nav class="nhsuk-breadcrumb" aria-label="Breadcrumb">
  <div class="nhsuk-width-container">
    <ol class="nhsuk-breadcrumb__list">
      <li class="nhsuk-breadcrumb__item"><a class="nhsuk-breadcrumb__link" href="tfg-table-view">Trade
        family
        groups</a></li>
    </ol>
  </div>
</nav>
{% endblock %}

{% block content %}
<div class="nhsuk-back-link">
  <a class="nhsuk-back-link__link" href="/trade-families/add-amp#trade-family">
    <svg class="nhsuk-icon nhsuk-icon__chevron-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
         aria-hidden="true" height="24" width="24">
      <path
          d="M8.5 12c0-.3.1-.5.3-.7l5-5c.4-.4 1-.4 1.4 0s.4 1 0 1.4L10.9 12l4.3 4.3c.4.4.4 1 0 1.4s-1 .4-1.4 0l-5-5c-.2-.2-.3-.4-.3-.7z">
      </path>
    </svg>
    Go back to AMP (Anadin extra tablets)</a>
</div>


<div class="nhsuk-grid-row">
  <div class="nhsuk-grid-column-full">
    <span class="nhsuk-caption-l" id="update-associated-tf-sub-heading">Update amp trade
      family</span>
    <span class="nhsuk-u-visually-hidden"> - </span>
    <h1 class="nhsuk-heading-xl" id="update-associated-tf-heading">Anadin Extra
      Tablets</h1>

    <section id="amp-0">
      <div class="nhsuk-grid-column-full update-box">
        <!--Current name-->
        <fieldset class="nhsuk-fieldset">
          <legend id="tf-0-name-legend"
                  class="nhsuk-fieldset__legend--m update-general-heading">Anadin
            Extra</legend>
          <input class="nhsuk-input" type="hidden" id="values0.name" name="values[0].name"
                 value="Parabuthus species scorpion venom antiserum">

          <!--Start Date-->
          <div class="nhsuk-grid-column-one-third">
            <div class="nhsuk-form-group">
              <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--m"
                      id="tf-0-start-date-legend">
                Start date
              </legend>

              <div class="nhsuk-form-group">
                <div class="nhsuk-date-input" id="tf-0-start-date">
                  <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                      <label class="nhsuk-label nhsuk-date-input__label"
                             for="tf-0-start-date-day"><span
                              class="nhsuk-u-visually-hidden">Start
                                                    date </span>Day</label>
                      <input
                          class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2 js-paste-date"
                          inputmode="numeric" maxlength="2" id="tf-0-start-date-day"
                          type="text"
                          name="values[0].startDate.day" value="28" />
                    </div>
                  </div>
                  <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                      <label class="nhsuk-label nhsuk-date-input__label"
                             for="tf-0-start-date-month"><span
                              class="nhsuk-u-visually-hidden">Start
                                                    date </span>Month</label>
                      <input
                          class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2 js-paste-date"
                          inputmode="numeric" maxlength="2" id="tf-0-start-date-month"
                          type="text" name="values[0].startDate.month" value="01" />
                    </div>
                  </div>
                  <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                      <label class="nhsuk-label nhsuk-date-input__label"
                             for="tf-0-start-date-year"><span
                              class="nhsuk-u-visually-hidden">Start
                                                    date </span>Year</label>
                      <input
                          class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-4 js-paste-date"
                          inputmode="numeric" maxlength="4" id="tf-0-start-date-year"
                          type="text"
                          name="values[0].startDate.year" value="2020" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!--End Date-->
          <div class="nhsuk-grid-column-one-third">
            <div class="nhsuk-form-group">
              <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--m"
                      id="tf-0-end-date-heading">
                End date
              </legend>

              <div class="nhsuk-form-group">
                <div class="nhsuk-date-input" id="tf-0-end-date">
                  <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                      <label class="nhsuk-label nhsuk-date-input__label"
                             for="tf-0-end-date-day"><span
                              class="nhsuk-u-visually-hidden">End date
                                                </span>Day</label>
                      <input
                          class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2 js-paste-date"
                          inputmode="numeric" maxlength="2" id="tf-0-end-date-day"
                          type="text"
                          name="values[0].endDate.day" value="01" />
                    </div>
                  </div>
                  <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                      <label class="nhsuk-label nhsuk-date-input__label"
                             for="tf-0-end-date-month"><span
                              class="nhsuk-u-visually-hidden">End
                                                    date </span>Month</label>
                      <input
                          class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2 js-paste-date"
                          inputmode="numeric" maxlength="2" id="tf-0-end-date-month"
                          type="text"
                          name="values[0].endDate.month" value="02" />
                    </div>
                  </div>
                  <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                      <label class="nhsuk-label nhsuk-date-input__label"
                             for="tf-0-end-date-year"><span
                              class="nhsuk-u-visually-hidden">End date
                                                </span>Year</label>
                      <input
                          class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-4 js-paste-date"
                          inputmode="numeric" maxlength="4" id="tf-0-end-date-year"
                          type="text"
                          name="values[0].endDate.year" value="3456" />
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="nhsuk-grid-column-full">
            <legend id="tf-0-add-heading"
                    class="nhsuk-fieldset__legend--m nhsuk-u-visually-hidden">
              Action
            </legend>
            <div class="action-update">
              <a href="/trade-families/tf/update-amp-tf-search" id="update-tf-0"
                 class="nhsuk-button nhsuk-button--secondary">
                Change associated Trade Family
              </a>
            </div>
          </div>
        </fieldset>
      </div>
    </section>

    <a class="nhsuk-button" href="update-amp-tf-confirm">Confirm</a>
  </div>
</div>

<script>
  // Replace tables with placeholder text if empty=true query parameter is present
  document.addEventListener('DOMContentLoaded', function() {
    // Check for empty=true query parameter
    const urlParams = new URLSearchParams(window.location.search);
    const isEmpty = urlParams.get('empty') === 'true';
    const afterEmptySearch = urlParams.get('after-empty-search') === 'true';
    const afterCurrentSearch = urlParams.get('after-current-search') === 'true';

    if (isEmpty) {
      // Append empty=true to the back link
      const backLink =
        document.querySelector('a[href="/trade-families/add-amp#trade-family"]');
      if (backLink) {
        backLink.setAttribute('href', `/trade-families/add-amp?empty=true#trade-family`);
      }

      // Replace "Anadin Extra" legend text with "No associated trade family"
      const legend = document.getElementById('tf-0-name-legend');
      if (legend) {
        legend.textContent = 'No associated Trade Family';
      }

      // Hide the start date section
      const startDateSection =
        document.querySelector('#tf-0-start-date').closest('.nhsuk-grid-column-one-third');
      if (startDateSection) {
        startDateSection.style.display = 'none';
      }

      // Hide the end date section
      const endDateSection =
        document.querySelector('#tf-0-end-date').closest('.nhsuk-grid-column-one-third');
      if (endDateSection) {
        endDateSection.style.display = 'none';
      }

      // Change update link to add
      const updateLink = document.getElementById('update-tf-0');
      if (updateLink) {
        const currentHref = updateLink.getAttribute('href');
        updateLink.setAttribute('href', currentHref + '?empty=true');
        updateLink.textContent = 'Add associated Trade Family';
      }
    }

    if (afterEmptySearch) {
      const backLink =
        document.querySelector('a[href="/trade-families/add-amp#trade-family"]');
      if (backLink) {
        backLink.setAttribute('href', `/trade-families/add-amp?empty=true#trade-family`);
      }

      // Change update link to add
      const updateLink = document.getElementById('update-tf-0');
      if (updateLink) {
        const currentHref = updateLink.getAttribute('href');
        updateLink.setAttribute('href', currentHref + '?after-empty-search=true');
      }

      // Update the continue button to preserve the parameter
      const confirmButton = document.querySelector('a[href="update-amp-tf-confirm"]');
      if (confirmButton) {
        confirmButton.setAttribute('href',
          'update-amp-tf-confirm?after-empty-search=true');
      }
    }

    if (afterCurrentSearch) {
      // Update the legend text
      const legend = document.getElementById('tf-0-name-legend');
      if (legend) {
        legend.textContent = 'Liberim Extra';
      }

      // Update start date to new values (e.g., 15/03/2021)
      const startDayInput = document.getElementById('tf-0-start-date-day');
      const startMonthInput = document.getElementById('tf-0-start-date-month');
      const startYearInput = document.getElementById('tf-0-start-date-year');

      if (startDayInput) startDayInput.value = '02';
      if (startMonthInput) startMonthInput.value = '02';
      if (startYearInput) startYearInput.value = '3000';

      // Update end date to new values (e.g., 30/06/2025)
      const endDayInput = document.getElementById('tf-0-end-date-day');
      const endMonthInput = document.getElementById('tf-0-end-date-month');
      const endYearInput = document.getElementById('tf-0-end-date-year');

      if (endDayInput) endDayInput.value = '01';
      if (endMonthInput) endMonthInput.value = '02';
      if (endYearInput) endYearInput.value = '3456';

      // Change update link to add
      const updateLink = document.getElementById('update-tf-0');
      if (updateLink) {
        const currentHref = updateLink.getAttribute('href');
        updateLink.setAttribute('href', currentHref + '?after-current-search=true');
      }

      // Update the continue button to preserve the parameter
      const confirmButton = document.querySelector('a[href="update-amp-tf-confirm"]');
      if (confirmButton) {
        confirmButton.setAttribute('href', 'update-amp-tf-confirm?after-current-search=true');
      }
    }
  });
</script>
{% endblock %}

{% extends "base-large.html" %}
{% block content %}
<div class="nhsuk-back-link">
  <a class="nhsuk-back-link__link" href="edit-tf">
    <svg class="nhsuk-icon nhsuk-icon__chevron-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
         aria-hidden="true" height="24" width="24">
      <path d="M8.5 12c0-.3.1-.5.3-.7l5-5c.4-.4 1-.4 1.4 0s.4 1 0 1.4L10.9 12l4.3 4.3c.4.4.4 1 0 1.4s-1 .4-1.4 0l-5-5c-.2-.2-.3-.4-.3-.7z"></path>
    </svg>
    Go back</a>
</div>

<div class="nhsuk-grid-row">
  <div class="nhsuk-grid-column-full">
    <br/>
    <h1 class="nhsuk-heading-xl">Edit <span id="heading-status-name">validation</span> status for trade family</h1>
  </div>
</div>

<div class="nhsuk-form-group">
  <fieldset class="nhsuk-fieldset">
    <legend class="nhsuk-fieldset__legend nhsuk-fieldset__legend--l">
      Do you want to change the <span id="form-heading-status-name">validation</span> status?
    </legend>

    <div class="nhsuk-hint" id="extractable-hint">
      Select which one is relevant to you
    </div>
    <div class="nhsuk-radios__item">
      <input class="nhsuk-radios__input" id="example-2" name="example" type="radio" value="yes" checked>
      <label class="nhsuk-label nhsuk-radios__label" for="example-2">
        <span id="option1">Valid</span> (default)
      </label>
    </div>
    <div class="nhsuk-radios" data-module="nhsuk-radios">
      <div class="nhsuk-radios__item">
        <input class="nhsuk-radios__input" id="example" name="example" type="radio" value="yes">
        <label class="nhsuk-label nhsuk-radios__label" for="example">
          <span id="option2">Invalid</span>
        </label>
      </div>

    </div>
  </fieldset>
</div>

<div class="nhsuk-grid-row">
  <div class="nhsuk-grid-column-full">
    <a href="edit-tf" class="nhsuk-button" id="edit-tf">Continue</a>
  </div>
</div>

<script>
    const urlParams = new URLSearchParams(globalThis.window.location.search);
    
    const statusName = urlParams.get('statusName') || '';
    document.getElementById('heading-status-name').innerText = statusName;
    document.getElementById('form-heading-status-name').innerText = statusName;

    const option1 = urlParams.get('option1') || '';
    const option2 = urlParams.get('option2') || '';
    document.getElementById('option1').innerText = option1;
    document.getElementById('option2').innerText = option2;
</script>

{% endblock %}

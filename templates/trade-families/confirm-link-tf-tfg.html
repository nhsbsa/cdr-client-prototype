{% extends "trade-families/base.html" %}
{% block content %}
<a class="nhsuk-back-link" href="link-amp-to-tf">Go back</a>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <br/>
        <h1 class="nhsuk-heading-xl">Confirmation</h1>
    </div>
</div>
<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <dl class="nhsuk-summary-list">

            <div class="nhsuk-summary-list__row">
                <dt class="nhsuk-summary-list__key">
                    Trade family group
                </dt>
                <dd class="nhsuk-summary-list__value">
                    Primary Wound
                </dd>
                <dd class="nhsuk-summary-list__actions">
                    <a href="#">
                        Change<span class="nhsuk-u-visually-hidden"> trade family group</span>
                    </a>
                </dd>
            </div>
            <div class="nhsuk-summary-list__row">
                <dt class="nhsuk-summary-list__key">
                    Trade family
                </dt>
                <dd class="nhsuk-summary-list__value">
                    1 Primary Wound
                </dd>
                <dd class="nhsuk-summary-list__actions">
                    <a href="link-amp-to-tf">
                        Change<span class="nhsuk-u-visually-hidden"> trade family</span>
                    </a>
                </dd>
            </div>
        </dl>
    </div>
</div>
<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <a href="tf-table-view" class="nhsuk-button">Save</a>
    </div>
</div>
<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <a href="view-tf">Cancel and go back to the trade family</a>
    </div>
</div>

{% endblock %}

{% extends "trade-families/base.html" %}
{% block content %}
<div class="nhsuk-back-link">
    <a class="nhsuk-back-link__link" href="/trade-families/tfg-table-view">
        <svg class="nhsuk-icon nhsuk-icon__chevron-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            aria-hidden="true" height="24" width="24">
            <path
                d="M8.5 12c0-.3.1-.5.3-.7l5-5c.4-.4 1-.4 1.4 0s.4 1 0 1.4L10.9 12l4.3 4.3c.4.4.4 1 0 1.4s-1 .4-1.4 0l-5-5c-.2-.2-.3-.4-.3-.7z">
            </path>
        </svg>
        Go back</a>
</div>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <span class="nhsuk-caption-l" id="update-associated-vtm-sub-heading">Basic details</span>
        <span class="nhsuk-u-visually-hidden"> - </span>
        <h1 class="nhsuk-heading-xl" id="update-associated-vtm-heading">Create new trade family group</h1>
    </div>
</div>
<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <div class="nhsuk-form-group">
            <label class="nhsuk-label" for="name">
                Name
            </label>
            <input class="nhsuk-input" id="name" type="text">
        </div>
    </div>
</div>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-one-half nhsuk-form-group">
        <fieldset class="nhsuk-fieldset" aria-describedby="start-date-hint" role="group">
            <legend class="nhsuk-fieldset__legend">
                <h3 class="nhsuk-fieldset__heading">
                    Start date
                </h3>
            </legend>
            <div class="nhsuk-hint" id="start-date-hint">
                For example, 15 3 1984
            </div>
            <div class="nhsuk-date-input" id="start-date">
                <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                        <label class="nhsuk-label nhsuk-date-input__label" for="start-day">
                            Day
                        </label>
                        <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2" id="start-day"
                            type="text" inputmode="numeric">
                    </div>
                </div>
                <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                        <label class="nhsuk-label nhsuk-date-input__label" for="start-month">
                            Month
                        </label>
                        <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2" id="start-month"
                            type="text" inputmode="numeric">
                    </div>
                </div>
                <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                        <label class="nhsuk-label nhsuk-date-input__label" for="start-year">
                            Year
                        </label>
                        <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-4" id="start-year"
                            type="text" inputmode="numeric">
                    </div>
                </div>
            </div>
        </fieldset>
    </div>
    <div class="nhsuk-grid-column-one-half nhsuk-form-group">
        <fieldset class="nhsuk-fieldset" aria-describedby="end-date-hint" role="group">
            <legend class="nhsuk-fieldset__legend">
                <h3 class="nhsuk-fieldset__heading">
                    End date
                </h3>
            </legend>
            <div class="nhsuk-hint" id="end-date-hint">
                For example, 15 3 1984
            </div>
            <div class="nhsuk-date-input" id="end-date">
                <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                        <label class="nhsuk-label nhsuk-date-input__label" for="end-day">
                            Day
                        </label>
                        <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2" id="end-day" type="text"
                            inputmode="numeric" value="01">
                    </div>
                </div>
                <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                        <label class="nhsuk-label nhsuk-date-input__label" for="end-month">
                            Month
                        </label>
                        <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2" id="end-month"
                            type="text" inputmode="numeric" value="02">
                    </div>
                </div>
                <div class="nhsuk-date-input__item">
                    <div class="nhsuk-form-group">
                        <label class="nhsuk-label nhsuk-date-input__label" for="end-year">
                            Year
                        </label>
                        <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-4" id="end-year"
                            type="text" inputmode="numeric" value="3456">
                    </div>
                </div>
            </div>
        </fieldset>
    </div>
</div>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <legend id="summary-extractable-legend" class="nhsuk-fieldset__legend--m">
            Is this trade family group extractable?
        </legend>

        <div class="nhsuk-form-group">
            <fieldset class="nhsuk-fieldset">
                <legend class="nhsuk-fieldset__legend"></legend>

                <div class="nhsuk-radios nhsuk-radios--inline">
                    <div class="nhsuk-radios__item">
                        <input class="nhsuk-radios__input" id="update-summary-radio-extractable-true" type="radio"
                            value="true" name="values[0].extractable" checked="checked">
                        <label class="nhsuk-label nhsuk-radios__label" for="update-summary-radio-extractable-true">
                            Yes
                        </label>
                    </div>

                    <div class="nhsuk-radios__item">
                        <input class="nhsuk-radios__input" id="update-summary-radio-extractable-false" value="false"
                            type="radio" name="values[0].extractable">
                        <label class="nhsuk-label nhsuk-radios__label" for="update-summary-radio-extractable-false">
                            No
                        </label>
                    </div>
                </div>
            </fieldset>
        </div>
    </div>
</div>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <a href="question-link-tfs" class="nhsuk-button">Create</a>
    </div>
</div>

<script>
    const date = new Date();
    const day = date.getDay();
    const month = date.getMonth() + 1;
    const year = date.getFullYear();

    document.getElementById('start-day').value = `${day < 10 ? '0' : ''}${day}`;
    document.getElementById('start-month').value = `${month < 10 ? '0' : ''}${month}`;
    document.getElementById('start-year').value = `${year}`;
</script>
{% endblock %}

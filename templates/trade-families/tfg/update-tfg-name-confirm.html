{% extends "base-large.html" %}
{% block content %}
<div class="nhsuk-back-link">
    <a class="nhsuk-back-link__link" href="update-tfg-name">
        <svg class="nhsuk-icon nhsuk-icon__chevron-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            aria-hidden="true" height="24" width="24">
            <path
                d="M8.5 12c0-.3.1-.5.3-.7l5-5c.4-.4 1-.4 1.4 0s.4 1 0 1.4L10.9 12l4.3 4.3c.4.4.4 1 0 1.4s-1 .4-1.4 0l-5-5c-.2-.2-.3-.4-.3-.7z">
            </path>
        </svg>
        Go back</a>
</div>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <br />
        <h1 class="nhsuk-heading-xl">Confirm name change</h1>
    </div>
</div>

<table class="nhsuk-table">

    <thead role="rowgroup" class="nhsuk-table__head">
        <tr role="row">
            <th class="nhsuk-table__header-identifier columnheader-sticky" id="attribute-table--tag-header"
                role="columnheader" scope="col" style="width: 10px;">
                <span class="nhsuk-u-visually-hidden">Indicator</span>
            </th>
            <th role="columnheader" class="" scope="col">
                Name
            </th>
            <th role="columnheader" class="nhsuk-table__header" scope="col">
                Start date
            </th>
            <th role="columnheader" class="nhsuk-table__header" scope="col">
                End date
            </th>
        </tr>
    </thead>
    <tbody class="nhsuk-table__body">
        <tr role="row" class="nhsuk-table__row" style="background-color: #C1DCCB;">
            <td class="nhsuk-table__cell-historic" role="cell">
                <span>
                    <span class="nhsuk-u-visually-hidden">Future dated</span>
                    <strong class="nhsuk-tag nhsuk-tag--purple">
                        <abbr title="Future dated">F</abbr>
                    </strong>
                </span>
            </td>
            <td class="nhsuk-table__cell">Anadin-Rebrand</td>
            <td class="nhsuk-table__cell">01-02-2027</td>
            <td class="nhsuk-table__cell">01-02-3456</td>
        </tr>
        <tr role="row" class="nhsuk-table__row">
            <td class="nhsuk-table__cell-historic nhsuk-u-visually-hidden" role="cell">
                <span>
                    <span class="nhsuk-u-visually-hidden">Historic</span>
                    <strong class="nhsuk-tag nhsuk-tag--orange">
                        <abbr title="Historic">H</abbr>
                    </strong>
                </span>
            </td>
            <td class="nhsuk-table__cell">Anadin</td>
            <td class="nhsuk-table__cell">01-02-2025</td>
            <td class="nhsuk-table__cell">01-02-2027</td>
        </tr>
    </tbody>
</table>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <a href="view-tfg?showNameUpdate#more" class="nhsuk-button" id="edit-tf">Save and finish</a>

        <a href="view-tfg#more" class="nhsuk-button nhsuk-button--secondary nhsuk-u-margin-left-3"">Cancel update</a> 
    </div>
</div>

{% endblock %}

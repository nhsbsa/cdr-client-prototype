{% extends "trade-families/base.html" %}
{% block content %}
<div class="nhsuk-back-link">
  <a class="nhsuk-back-link__link" href="edit-tfg.html">
    <svg class="nhsuk-icon nhsuk-icon__chevron-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
         aria-hidden="true" height="24" width="24">

<div class="nhsuk-grid-row">
  <div class="nhsuk-grid-column-full">
    <br/>
    <h1 class="nhsuk-heading-xl">Edit trade family group name</h1>
  </div>
</div>


<div class="nhsuk-grid-row">
  <div class="nhsuk-grid-column-full">
    <div class="nhsuk-form-group">
      <h2 class="nhsuk-label-wrapper">
        <label class="nhsuk-label nhsuk-label--l" for="full-name">
          What is the new name of the trade family group?
        </label>
      </h2>
      <input class="nhsuk-input" id="full-name" name="fullName" value="" type="text">
    </div>
  </div>
</div>

<div class="nhsuk-grid-row">
  <div class="nhsuk-grid-column-full">
    <a href="edited-new-name-tfg.html" class="nhsuk-button" id="edit-tf">Continue</a>

<!--  </div>-->
<!--</div>-->

{% endblock %}

{% block scripts %}

<script>
  var journey = localStorage.getItem("tf-journey");
  if (journey === "tf") {
    document.getElementById("create-link").href = "search-amp";
  }
</script>

<script>
  function setAMPJourney() {
    localStorage.setItem("amp-journey", "new-amp");
  }
</script>

{% endblock %}

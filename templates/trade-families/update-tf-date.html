{% extends "base-large.html" %}
{% block content %}
<div class="nhsuk-back-link">
    <a id="back-link" class="nhsuk-back-link__link" href="edit-tf">
        <svg class="nhsuk-icon nhsuk-icon__chevron-left" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
            aria-hidden="true" height="24" width="24">
            <path
                d="M8.5 12c0-.3.1-.5.3-.7l5-5c.4-.4 1-.4 1.4 0s.4 1 0 1.4L10.9 12l4.3 4.3c.4.4.4 1 0 1.4s-1 .4-1.4 0l-5-5c-.2-.2-.3-.4-.3-.7z">
            </path>
        </svg>
        Go back</a>
</div>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <br />
        <h1 class="nhsuk-heading-xl">Edit <span id="heading-date-label">start</span> date</h1>
    </div>
</div>


<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <div class="nhsuk-form-group">
            <fieldset class="nhsuk-fieldset" role="group" aria-describedby="date-of-birth-hint">
                <legend class="nhsuk-fieldset__legend nhsuk-label--l">
                    <h2 class="nhsuk-fieldset__heading">
                        What is your new <span id="field-heading-date-label">start</span> date?
                    </h2>
                </legend>
                <div id="date-of-birth-hint" class="nhsuk-hint">
                    For example, 15 3 1984
                </div>
                <div id="date-of-birth" class="nhsuk-date-input">
                    <div class="nhsuk-date-input__item">
                        <div class="nhsuk-form-group">
                            <label class="nhsuk-label nhsuk-date-input__label" for="date-of-birth-day">
                                Day
                            </label>
                            <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2"
                                id="date-of-birth-day" name="dateOfBirth[day]" value="01" type="text"
                                inputmode="numeric">
                        </div>
                    </div>
                    <div class="nhsuk-date-input__item">
                        <div class="nhsuk-form-group">
                            <label class="nhsuk-label nhsuk-date-input__label" for="date-of-birth-month">
                                Month
                            </label>
                            <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-2"
                                id="date-of-birth-month" name="dateOfBirth[month]" value="01" type="text"
                                inputmode="numeric">
                        </div>
                    </div>
                    <div class="nhsuk-date-input__item">
                        <div class="nhsuk-form-group">
                            <label class="nhsuk-label nhsuk-date-input__label" for="date-of-birth-year">
                                Year
                            </label>
                            <input class="nhsuk-input nhsuk-date-input__input nhsuk-input--width-4"
                                id="date-of-birth-year" name="dateOfBirth[year]" value="2020" type="text"
                                inputmode="numeric">
                        </div>
                    </div>
                </div>
            </fieldset>
        </div>
    </div>
</div>

<div class="nhsuk-grid-row">
    <div class="nhsuk-grid-column-full">
        <a href="edit-tf" class="nhsuk-button" id="edit-tf">Continue</a>
    </div>
</div>

{% endblock %}

{% block scripts %}

<script>
    const urlParams = new URLSearchParams(globalThis.window.location.search);
    
    const dateType = urlParams.get('dateType') || 'start ';
    const backLinkHref = urlParams.get('backLink') || 'update-tfg';
    document.getElementById('back-link').setAttribute('href', backLinkHref);
    document.getElementById('heading-date-label').textContent = dateType;
    document.getElementById('field-heading-date-label').textContent = dateType;

    const day = urlParams.get('day') || '01';
    const month = urlParams.get('month') || '01';
    const year = urlParams.get('year') || '2020';
    document.getElementById('date-of-birth-day').value = day;
    document.getElementById('date-of-birth-month').value = month;
    document.getElementById('date-of-birth-year').value = year;
</script>

{% endblock %}
